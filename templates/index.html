{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Header / Search -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-10">
        <h1 class="text-3xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-indigo-300">
            My Dark Sky
        </h1>
        <div class="relative w-full md:w-96">
            <input type="text" id="searchInput" placeholder="Search city..."
                class="w-full bg-slate-800/50 border border-slate-600/50 rounded-full px-5 py-2.5 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400/50 focus:border-blue-400/50 transition-all">
            <div id="searchResults" class="absolute top-full left-0 right-0 mt-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden hidden z-50"></div>
        </div>
    </div>

    <!-- Location Controls -->
    <div class="flex items-center justify-center gap-3 mb-8">
        <button id="locateBtn" class="flex items-center gap-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 px-4 py-2 rounded-full text-sm font-medium transition-colors border border-blue-500/30">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
            Use My Location
        </button>
    </div>

    <!-- Main Weather Card -->
    <div id="weatherCard" class="hidden glass-card rounded-3xl p-8 mb-8 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>

        <div class="relative z-10">
            <h2 id="locationName" class="text-xl font-semibold text-slate-200 mb-1">--</h2>
            <p id="locationDate" class="text-sm text-slate-400 mb-6">--</p>

            <div class="flex items-center justify-center gap-6 mb-6">
                <i id="weatherIcon" data-lucide="sun" class="w-16 h-16 text-yellow-400"></i>
                <div class="text-left">
                    <div id="mainTemp" class="text-6xl font-light tracking-tighter">--°</div>
                    <div id="weatherDesc" class="text-slate-300 font-medium">--</div>
                </div>
            </div>

            <div class="flex justify-center gap-8 text-sm text-slate-400 mb-6">
                <span>H: <span id="tempHigh" class="text-slate-200 font-medium">--°</span></span>
                <span>L: <span id="tempLow" class="text-slate-200 font-medium">--°</span></span>
            </div>

            <!-- Date Navigation -->
            <div class="flex items-center justify-center gap-4 mb-2">
                <button id="prevDateBtn" class="p-2 hover:bg-white/5 rounded-full transition-colors">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <input type="date" id="datePicker" class="bg-slate-800/50 border border-slate-600/50 rounded-lg px-3 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-400/50">
                <button id="nextDateBtn" class="p-2 hover:bg-white/5 rounded-full transition-colors">
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 mt-1">Travel through time</p>
        </div>
    </div>

    <!-- Hourly Chart -->
    <div id="chartCard" class="hidden glass-card rounded-3xl p-6 mb-8">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">Hourly Forecast</h3>
        <div class="h-64 w-full">
            <canvas id="hourlyChart"></canvas>
        </div>
    </div>

    <!-- Details Grid -->
    <div id="detailsCard" class="hidden glass-card rounded-3xl p-6 mb-8">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">Details</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800/30 rounded-xl p-4 text-center">
                <i data-lucide="droplets" class="w-5 h-5 text-blue-400 mx-auto mb-2"></i>
                <div class="text-xs text-slate-400">Humidity</div>
                <div id="detailHumidity" class="text-lg font-semibold">--</div>
            </div>
            <div class="bg-slate-800/30 rounded-xl p-4 text-center">
                <i data-lucide="wind" class="w-5 h-5 text-slate-300 mx-auto mb-2"></i>
                <div class="text-xs text-slate-400">Wind</div>
                <div id="detailWind" class="text-lg font-semibold">--</div>
            </div>
            <div class="bg-slate-800/30 rounded-xl p-4 text-center">
                <i data-lucide="cloud-rain" class="w-5 h-5 text-purple-400 mx-auto mb-2"></i>
                <div class="text-xs text-slate-400">Precipitation</div>
                <div id="detailPrecip" class="text-lg font-semibold">--</div>
            </div>
            <div class="bg-slate-800/30 rounded-xl p-4 text-center">
                <i data-lucide="gauge" class="w-5 h-5 text-green-400 mx-auto mb-2"></i>
                <div class="text-xs text-slate-400">Pressure</div>
                <div id="detailPressure" class="text-lg font-semibold">--</div>
            </div>
        </div>
    </div>

    <!-- Daily Strip -->
    <div id="forecastCard" class="hidden glass-card rounded-3xl p-6">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">14-Day Forecast</h3>
        <div id="forecastStrip" class="flex gap-3 overflow-x-auto pb-2 snap-x"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="hidden text-center py-20">
        <div class="inline-block w-8 h-8 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-slate-400 mt-3 text-sm">Fetching weather data...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden text-center py-20">
        <i data-lucide="alert-circle" class="w-10 h-10 text-red-400 mx-auto mb-3"></i>
        <p id="errorMessage" class="text-slate-300">Something went wrong.</p>
    </div>
</div>
{% endblock %}
